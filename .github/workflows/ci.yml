name: ci
# The pipeline is Python, so its tests run anywhere. They gate the workflow that
# spends an hour of runner time per image.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # pyyaml: tests/test_workflows.py reads the render workflow as YAML.
        run: python -m pip install --quiet pytest pillow pyyaml
      - name: Run the suite
        run: python -m pytest tests -q
